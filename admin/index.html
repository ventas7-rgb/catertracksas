<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador de productos | CaterTrack</title><link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header"><div><p class="eyebrow">CaterTrack</p><h1>Administrador de productos</h1><p>Gestiona el catálogo sin editar código.</p></div><button id="open-folder" class="button button--primary">Abrir carpeta del proyecto</button></header>
  <main class="admin-layout">
    <aside class="panel product-list"><div class="panel-heading"><h2>Productos</h2><button id="new-product" class="button button--small">Nuevo</button></div><input id="product-search" type="search" placeholder="Buscar producto"><div id="product-list-items"></div></aside>
    <section class="panel editor"><div class="panel-heading"><div><p class="eyebrow">Ficha de producto</p><h2 id="form-title">Nuevo producto</h2></div><span id="status" class="status">Sin cambios</span></div>
      <form id="product-form" novalidate>
        <div class="service-status-banner"><span id="service-status" class="service-status">Verificando servicio...</span></div>
        <div class="form-grid"><label>Nombre *<input id="name" required></label><label>Referencia (opcional)<input id="reference"></label><label>Categoría *<select id="category" required></select></label><label>Subcategoría *<input id="subcategory" required list="subcategory-options"><datalist id="subcategory-options"></datalist></label><label>Marca *<input id="brand" required></label><label>Aplicación / modelo *<input id="application" required></label><label class="full">Descripción *<textarea id="description" required rows="4"></textarea></label></div>
        <fieldset><legend>Imagen</legend><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/svg+xml"><p id="image-name" class="hint">No se ha seleccionado una imagen.</p><img id="image-preview" class="image-preview" alt="Vista previa"></fieldset>
        <fieldset><legend>SEO editable</legend><div class="form-grid"><label>Slug / URL *<input id="slug" required></label><label>Título SEO *<input id="seoTitle" required></label><label class="full">Meta description *<textarea id="metaDescription" required rows="3"></textarea></label><label>Texto ALT *<input id="alt" required></label></div></fieldset>
        <fieldset><legend>Productos relacionados</legend><select id="relatedProducts" multiple size="5"></select><p class="hint">Mantén Ctrl/Cmd para seleccionar varios.</p></fieldset>
        <div class="actions"><button type="button" id="duplicate-product" class="button">Duplicar</button><button type="button" id="delete-product" class="button button--danger">Despublicar</button><button type="button" id="save-product" class="button">Guardar producto</button><button type="button" id="publish-product" class="button button--primary" disabled>PUBLICAR PRODUCTO</button></div>
      </form>
    </section>
    <aside class="panel preview"><div class="panel-heading"><h2>Vista previa</h2><select id="preview-mode"><option value="card">Tarjeta</option><option value="page">Página</option></select></div><div id="preview-content"></div><div id="warnings" class="warnings"></div></aside>
  </main>
  <div id="toast" role="status" class="toast"></div><script src="admin.js"></script>
</body>
</html>
