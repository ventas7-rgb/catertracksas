<article class="product-card" data-subcategory="{{subcategorySlug}}">
  <a href="{{productUrl}}" class="product-card__visual" aria-label="Ver {{name}}"><img src="{{image}}" alt="{{alt}}" width="1200" height="900" loading="lazy" decoding="async"></a>
  <div class="product-card__content"><span class="product-card__category">{{subcategory}}</span><h3>{{name}}</h3>
    <dl class="product-card__details"><div><dt>Referencia</dt><dd>{{reference}}</dd></div><div><dt>Marca</dt><dd>{{brand}}</dd></div><div><dt>Aplicación</dt><dd>{{application}}</dd></div></dl>
    <p class="product-card__description">{{description}}</p>
    <a class="product-card__cta" href="https://wa.me/573132416739?text=Hola%20CaterTrack%2C%20quiero%20cotizar%20{{whatsappName}}" target="_blank" rel="noopener noreferrer">Solicitar cotización <span aria-hidden="true">→</span></a>
  </div>
</article>
